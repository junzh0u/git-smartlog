name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # Catches the class of breakage that otherwise only shows up at runtime:
      # the script is never imported, so nothing else parses it.
      - name: Parse
        run: |
          zsh -n git-smartlog
          zsh -n completions/_git-smartlog
          zsh -n completions/_git-smartstat
          zsh -n completions/_git-smartshow
          zsh -n completions/_git-smartdiff
          zsh -n dev/make-demo.zsh
          zsh -n dev/make-screenshots.zsh
          zsh -n dev/make-fixtures.zsh
          zsh -n test/test-readme-examples.zsh
          zsh -n test/test-row-keys.zsh
          zsh -n test/test-regressions.zsh
          python3 -m py_compile test/readme_examples.py

      # Every example in the README, replayed against a freshly built fixture
      # repo. The README is the golden file — see test/test-readme-examples.zsh.
      - name: README examples
        run: ./test/test-readme-examples.zsh

      # -i's fzf input: the plain render plus a key column naming each row's
      # node. The interactive half is fzf's; the tagging is what can drift.
      - name: Row keys
        run: ./test/test-row-keys.zsh

      # Corners no README example should carry (option forms, conflicted
      # paths, SHA-256 repos), each in its own throwaway repo.
      - name: Regressions
        run: ./test/test-regressions.zsh
